{{ define "main" }}
  {{ with .Content }}
    <div class="index-content">
      {{ . }}
    </div>
  {{ end }}

  <div class="posts">
    <article class="post on-list">
      <div class="post-content">
        <input
          id="search-input"
          type="search"
          placeholder="Search..."
          aria-label="Search"
        />
        <div id="search-status" class="post-meta">Loading search index...</div>
      </div>
    </article>
  </div>

  <div id="search-results" class="posts"></div>

  <script>
    (function () {
      var input = document.getElementById("search-input");
      var results = document.getElementById("search-results");
      var status = document.getElementById("search-status");
      var indexUrl = "{{ "index.json" | relURL }}";
      var index = [];

      if (!input || !results || !status) {
        return;
      }

      function normalize(value) {
        return (value || "").toLowerCase();
      }

      function buildSnippet(item) {
        var text = item.summary || item.content || "";
        var snippet = text.replace(/\s+/g, " ").trim();
        if (snippet.length > 220) {
          return snippet.slice(0, 217) + "...";
        }
        return snippet;
      }

      function render(items, query) {
        results.innerHTML = "";
        if (!query) {
          status.textContent = "Type to search.";
          return;
        }
        if (!items.length) {
          status.textContent = "No results.";
          return;
        }
        status.textContent =
          items.length + " result" + (items.length === 1 ? "" : "s");

        var fragment = document.createDocumentFragment();
        items.forEach(function (item) {
          var article = document.createElement("article");
          article.className = "post on-list";

          var title = document.createElement("h1");
          title.className = "post-title";
          var link = document.createElement("a");
          link.href = item.url || "#";
          link.textContent = item.title || item.url || "Untitled";
          title.appendChild(link);
          article.appendChild(title);

          if (item.date) {
            var meta = document.createElement("div");
            meta.className = "post-meta";
            var time = document.createElement("time");
            time.className = "post-date";
            time.textContent = item.date;
            meta.appendChild(time);
            article.appendChild(meta);
          }

          var snippet = buildSnippet(item);
          if (snippet) {
            var content = document.createElement("div");
            content.className = "post-content";
            content.textContent = snippet;
            article.appendChild(content);
          }

          fragment.appendChild(article);
        });
        results.appendChild(fragment);
      }

      function search(query) {
        var q = normalize(query).trim();
        if (!q) {
          render([], "");
          return;
        }
        var tokens = q.split(/\s+/).filter(Boolean);
        var hits = [];
        index.forEach(function (item) {
          if (!item._haystack) {
            return;
          }
          var match = tokens.every(function (token) {
            return item._haystack.indexOf(token) !== -1;
          });
          if (match) {
            hits.push(item);
          }
        });
        render(hits, q);
      }

      fetch(indexUrl)
        .then(function (response) {
          if (!response.ok) {
            throw new Error("Search index request failed");
          }
          return response.json();
        })
        .then(function (data) {
          index = (data || []).map(function (item) {
            var haystack = normalize(
              [item.title, item.summary, item.content, item.tags].join(" ")
            );
            item._haystack = haystack;
            return item;
          });
          status.textContent = "Type to search.";
          var params = new URLSearchParams(window.location.search);
          var query = params.get("q");
          if (query) {
            input.value = query;
            search(query);
          }
        })
        .catch(function () {
          status.textContent = "Failed to load search index.";
        });

      input.addEventListener("input", function () {
        search(input.value);
      });
    })();
  </script>
{{ end }}
